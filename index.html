<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coasters Tavern Digital Signage</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&family=Roboto:wght@700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM (UMD for standalone) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000;
        color: white;
        overflow: hidden;
      }
      h1, h2, h3, .serif {
        font-family: 'Playfair Display', serif;
      }

      /* --- Animations --- */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes shimmer {
        100% { transform: translateX(100%) skewX(12deg); }
      }
      @keyframes subtleZoom {
        0% { transform: scale(1); }
        100% { transform: scale(1.15); }
      }
      @keyframes rain {
        0% { transform: translateY(0); opacity: 0; }
        20% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(60px); opacity: 0; }
      }
      @keyframes pulse-glow {
        0%, 100% { filter: drop-shadow(0 0 40px currentColor); }
        50% { filter: drop-shadow(0 0 70px currentColor); }
      }

      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-spin-slow { animation: spin-slow 12s linear infinite; }
      .animate-shimmer { animation: shimmer 2s infinite; }
      .animate-rain { animation: rain 1.5s ease-in infinite; }

      .text-glow { text-shadow: 0 0 20px rgba(255,255,255,0.4); }
      .box-glow { box-shadow: 0 0 30px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.1); }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // --- CONSTANTS & TYPES ---
        const SLIDE_DURATION_MS = 30000;
        const STORAGE_KEY = 'restaurant_slides_v6';

        const INITIAL_SLIDES = [
          {
            id: '0',
            day: 'Welcome',
            title: '',
            description: '',
            price: '',
            imageUrl: '',
            backgroundImageUrl: '',
            descriptionImageUrl: 'front-images/GOLD-FLAME-LOGO-BLACK.jpg',
            highlightColor: '#d4af37',
            type: 'promo'
          },
          { id: '1', day: 'Monday', title: 'Steak Day Monday\'s', description: 'Start your week off with a 200g Succulent Rump Steak, cooked to your liking, served with golden fries and a green garden salad.', price: '$20', imageUrl: 'images/steak-night.jpg', backgroundImageUrl: 'back-images/bg1.jpg', highlightColor: '#f59e0b', type: 'promo' },
          { id: '2', day: 'Tuesday', title: 'Chase the Ace', description: 'Purchase a beverage between 3.30pm and 5.30pm and you\'re in the draw.', price: '5.30pm Draw!', imageUrl: '', backgroundImageUrl: 'back-images/acer.webp', highlightColor: '#ef4444', type: 'promo' },
          { id: '3', day: 'Wednesday', title: 'Quiz Night', description: 'Every Wednesday Night from 7.00pm, $190 in prizes up for grabs. Bookings Essential.', price: 'FREE ENTRY', imageUrl: '', backgroundImageUrl: '', highlightColor: '#eab308', type: 'promo' },
          { id: '4', day: 'Thursday', title: 'Burger Day Thursdays', description: 'Your choice of Chicken, Beer Battered Fish, Pork Belly or Coasters Beef Burger, all served with Golden Fries & Onion Rings.', price: '$19 each or 2 for $35!', imageUrl: 'images/burger-night.jpg', backgroundImageUrl: '', highlightColor: '#f97316', type: 'promo' },
          { id: '5', day: 'Thursday &Friday', title: 'Happy Hours!', description: 'Enjoy 10% discount on selected beverages between 4.30pm & 6.30pm.', price: '10% Off!', imageUrl: '', backgroundImageUrl: 'back-images/drink.jpg', highlightColor: '#3b82f6', type: 'promo' },
          { id: '6', day: 'Saturday', title: 'Chase the Ace', description: 'Purchase a beverage between 3.30pm and 5.30pm and you\'re in the draw. Drawn @ 6.30pm.', price: '6.30pm Draw', imageUrl: 'back-images/acer.webp', backgroundImageUrl: '', highlightColor: '#06b6d4', type: 'promo' },
          { id: '7', day: 'Sunday', title: 'Two Course Sunday Roast', description: 'Traditional roast of the day with roasted vegetables, seasonal greens and rich gravy, with an Ice Cream Sundae to finish.', price: '$28', imageUrl: 'images/roast.jpg', backgroundImageUrl: '', highlightColor: '#84cc16', type: 'promo' },
          { id: '9', day: 'Thursday', title: 'Free Pool Thursdays', description: 'Our Pool Table is Free all day and night on Thursdays! Grab a cue and challenge your mates.', price: 'FREE', imageUrl: 'images/burger-night.jpg', backgroundImageUrl: '', highlightColor: '#f97316', type: 'promo' },
          { id: '10', day: 'Membership', title: 'Loyalty App', description: 'Join our loyalty program! Earn points with every purchase and redeem them for food and drinks.', price: 'Join Today', imageUrl: 'images/platter.jpg', backgroundImageUrl: '', highlightColor: '#8b5cf6', type: 'promo' }
        ];

        // --- ICONS (Inline SVGs) ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );

        const Icons = {
            Settings: (props) => <Icon {...props} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />,
            Play: (props) => <Icon {...props} path={<polygon points="5 3 19 12 5 21 5 3"/>} />,
            Pause: (props) => <Icon {...props} path={<><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></>} />,
            SkipForward: (props) => <Icon {...props} path={<><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></>} />,
            SkipBack: (props) => <Icon {...props} path={<><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></>} />,
            Plus: (props) => <Icon {...props} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Trash2: (props) => <Icon {...props} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            Save: (props) => <Icon {...props} path={<><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>} />,
            X: (props) => <Icon {...props} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />,
            ArrowLeft: (props) => <Icon {...props} path={<><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>} />,
            LayoutGrid: (props) => <Icon {...props} path={<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>} />,
            Image: (props) => <Icon {...props} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></>} />
        };

        const AdminPanel = ({ slides, onSave, onClose }) => {
            const [localSlides, setLocalSlides] = useState(slides);
            const [hasChanges, setHasChanges] = useState(false);

            const handleUpdate = (id, updates) => {
                setLocalSlides(prev => prev.map(s => s.id === id ? { ...s, ...updates } : s));
                setHasChanges(true);
            };

            const handleCreate = () => {
                const newSlide = { id: Date.now().toString(), type: 'promo', day: 'Monday', title: 'New Event', description: 'Details...', price: '$0', imageUrl: 'images/steak-night.jpg', highlightColor: '#f59e0b' };
                setLocalSlides([...localSlides, newSlide]);
                setHasChanges(true);
            };

            const handleDelete = (id) => {
                if (confirm('Delete this slide?')) {
                    setLocalSlides(prev => prev.filter(s => s.id !== id));
                    setHasChanges(true);
                }
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-950 text-white flex flex-col overflow-hidden">
                    <div className="bg-slate-900 border-b border-slate-800 p-6 flex justify-between items-center">
                        <div className="flex items-center gap-6">
                            <button onClick={onClose} className="p-2 hover:bg-slate-800 rounded-full transition-colors"><Icons.ArrowLeft className="w-6 h-6" /></button>
                            <h1 className="text-3xl font-serif font-bold text-amber-500 flex items-center gap-3"><Icons.LayoutGrid className="w-8 h-8" /> Admin Slide Editor</h1>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={handleCreate} className="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-lg font-bold border border-slate-700 flex items-center gap-2"><Icons.Plus className="w-5 h-5" /> Add Slide</button>
                            <button onClick={() => { onSave(localSlides); setHasChanges(false); }} disabled={!hasChanges} className={`px-8 py-2.5 rounded-lg font-bold transition-all flex items-center gap-2 ${hasChanges ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}><Icons.Save className="w-5 h-5" /> {hasChanges ? 'Save Changes' : 'Saved'}</button>
                            <button onClick={onClose} className="p-2 hover:bg-red-500/20 text-slate-400 hover:text-red-400 rounded-full"><Icons.X className="w-6 h-6" /></button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-8 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-slate-900 to-slate-950">
                        <div className="max-w-[1600px] mx-auto grid grid-cols-1 xl:grid-cols-2 2xl:grid-cols-3 gap-6 pb-20">
                            {localSlides.map((slide, idx) => (
                                <div key={slide.id} className="bg-slate-900/50 border border-slate-800 rounded-2xl overflow-hidden flex flex-col p-6 space-y-4 hover:border-amber-500/30 transition-all">
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-500">Slide #{idx + 1}</span>
                                        <button onClick={() => handleDelete(slide.id)} className="p-2 text-slate-600 hover:text-red-400 hover:bg-red-400/10 rounded-lg"><Icons.Trash2 className="w-4 h-4" /></button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Day</label><input type="text" value={slide.day} onChange={e => handleUpdate(slide.id, { day: e.target.value })} className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-sm outline-none focus:border-amber-500" /></div>
                                        <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Price</label><input type="text" value={slide.price} onChange={e => handleUpdate(slide.id, { price: e.target.value })} className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-sm outline-none focus:border-amber-500 font-bold text-amber-500" /></div>
                                    </div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Title</label><input type="text" value={slide.title} onChange={e => handleUpdate(slide.id, { title: e.target.value })} className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-sm font-bold outline-none focus:border-amber-500" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Description</label><textarea value={slide.description} onChange={e => handleUpdate(slide.id, { description: e.target.value })} rows={3} className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-sm outline-none focus:border-amber-500 resize-none" /></div>
                                    <div className="flex items-center gap-4">
                                        <div className="flex-1 space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Image Path</label><input type="text" value={slide.imageUrl} onChange={e => handleUpdate(slide.id, { imageUrl: e.target.value })} className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-xs font-mono outline-none focus:border-amber-500" /></div>
                                        <div className="shrink-0 space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Color</label><input type="color" value={slide.highlightColor} onChange={e => handleUpdate(slide.id, { highlightColor: e.target.value })} className="h-9 w-9 bg-transparent block cursor-pointer border border-slate-700 rounded-lg" /></div>
                                    </div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Background Image</label><input type="text" value={slide.backgroundImageUrl || ''} onChange={e => handleUpdate(slide.id, { backgroundImageUrl: e.target.value })} placeholder="e.g., back-images/custom-bg.jpg" className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-xs font-mono outline-none focus:border-amber-500" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Description Image</label><input type="text" value={slide.descriptionImageUrl || ''} onChange={e => handleUpdate(slide.id, { descriptionImageUrl: e.target.value })} placeholder="e.g., front-images/promo-image.jpg" className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-xs font-mono outline-none focus:border-amber-500" /></div>
                                </div>
                            ))}
                            <button onClick={handleCreate} className="border-2 border-dashed border-slate-800 rounded-2xl flex flex-col items-center justify-center p-12 text-slate-600 hover:text-amber-500 hover:border-amber-500/50 transition-all"><Icons.Plus className="w-10 h-10 mb-2" /><span className="font-bold uppercase tracking-widest text-xs">Add New Promo</span></button>
                        </div>
                    </div>
                </div>
            );
        };

        const Slide = ({ data }) => {
            const isLogoSlide = (!data.title && !data.description) || data.day === 'Welcome';

            return (
                <div className="relative w-full h-full overflow-hidden font-sans bg-black">
                    <style>{`
                        @keyframes slide-in-epic {
                          0% { transform: scale(1.2); opacity: 0; filter: blur(20px); }
                          100% { transform: scale(1); opacity: 1; filter: blur(0px); }
                        }
                        .animate-epic-in {
                          animation: slide-in-epic 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                        }
                        .text-glow {
                          text-shadow: 0 0 30px rgba(255,255,255,0.6);
                        }
                        /* Professional Flame Animations */
                        @keyframes flame-rise {
                          0% { transform: translateY(0) scale(1); opacity: 0.8; }
                          100% { transform: translateY(-40px) scale(0.5); opacity: 0; }
                        }
                        @keyframes flame-morph {
                          0% { border-radius: 45% 45% 20% 20%; }
                          50% { border-radius: 30% 30% 40% 40%; }
                          100% { border-radius: 45% 45% 20% 20%; }
                        }
                        .flame-container {
                          filter: blur(4px) contrast(20);
                          background: transparent;
                        }
                        .flame-particle {
                          position: absolute;
                          bottom: 0;
                          left: 50%;
                          transform: translateX(-50%);
                          width: 40px;
                          height: 40px;
                          background: linear-gradient(to top, rgba(255,100,0,1), rgba(255,200,0,0.8));
                          border-radius: 50% 50% 20% 20%;
                          animation: flame-rise 1.5s infinite ease-in;
                        }
                    `}</style>
                    <div className="absolute inset-0">
                        <img src={data.backgroundImageUrl || data.imageUrl} alt={data.title} onError={(e) => { e.currentTarget.style.display = 'none'; }} className={`w-full h-full object-cover transition-transform duration-[30000ms] ease-linear transform scale-100 ${isLogoSlide ? 'opacity-30 blur-sm' : 'opacity-100'}`} style={{ animation: 'subtleZoom 35s linear infinite alternate' }} />
                        <div className="absolute inset-0 bg-black/40"></div>
                        <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/60"></div>
                    </div>
                    <div className="relative z-10 w-full h-full flex flex-col justify-center items-center p-[25%] mx-auto text-center space-y-12 overflow-hidden animate-epic-in">
                        {isLogoSlide ? (
                            <div className="flex flex-col items-center">
                                <div className="relative group w-auto h-full max-h-[80%] flex items-center justify-center">
                                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-amber-500/10 blur-[100px] rounded-full"></div>
                                    <img src={data.descriptionImageUrl || data.imageUrl} alt="Coasters Tavern Logo" className="relative w-full h-full object-contain drop-shadow-[0_10px_40px_rgba(0,0,0,0.5)]" />
                                    
                                    <div className="absolute top-[58%] left-[50.1%] w-[12vh] h-[16vh] -translate-x-1/2 -translate-y-full pointer-events-none flex items-center justify-center">
                                        <div className="absolute w-[300%] h-[300%] bg-orange-600/20 blur-[60px] rounded-full mix-blend-screen animate-pulse"></div>
                                        <div className="relative w-full h-full flame-container overflow-visible">
                                            <div className="flame-particle" style={{ animationDelay: '0s', width: '45px', height: '60px' }}></div>
                                            <div className="flame-particle" style={{ animationDelay: '0.2s', width: '35px', height: '50px', left: '48%' }}></div>
                                            <div className="flame-particle" style={{ animationDelay: '0.5s', width: '40px', height: '55px', left: '52%' }}></div>
                                            <div className="flame-particle" style={{ animationDelay: '0.8s', width: '30px', height: '45px' }}></div>
                                            <div className="flame-particle" style={{ animationDelay: '1.2s', width: '25px', height: '40px', left: '49%' }}></div>
                                            <div className="absolute bottom-4 left-1/2 -translate-x-1/2 w-8 h-12 bg-white/90 blur-sm rounded-full mix-blend-overlay" style={{ animation: 'flame-morph 0.5s infinite alternate' }}></div>
                                        </div>
                                        <div className="absolute top-0 w-full h-full overflow-visible">
                                            <div className="absolute w-1 h-1 bg-yellow-200 rounded-full animate-ping" style={{ top: '-40%', left: '40%' }}></div>
                                            <div className="absolute w-1.5 h-1.5 bg-orange-400 rounded-full animate-pulse" style={{ top: '-70%', left: '60%', animationDelay: '1s' }}></div>
                                        </div>
                                    </div>
                                </div>
                                {data.day === 'Welcome' && data.title && (
                                    <h1 className="mt-12 text-7xl font-serif font-black text-white text-glow">{data.title}</h1>
                                )}
                            </div>
                        ) : (
                            <>
                                <div className="animate-slide-down"><span className="px-14 py-6 rounded-full text-5xl font-black uppercase tracking-[0.2em] border-2 border-white/40 backdrop-blur-xl shadow-[0_0_40px_rgba(255,255,255,0.3)]" style={{ backgroundColor: `${data.highlightColor}40`, borderColor: data.highlightColor, color: '#fff' }}>{data.day || 'Special Event'}</span></div>
                                <div className="flex flex-col items-center space-y-12 w-full overflow-visible">
                                    <h1 className="text-8xl md:text-[10rem] font-serif font-black leading-[1.1] text-white drop-shadow-[0_10px_30px_rgba(0,0,0,0.9)] text-glow tracking-tight whitespace-nowrap px-4">{data.title}</h1>
                                    <div className="h-3 w-80 rounded-full shadow-[0_0_30px_rgba(245,158,11,0.8)]" style={{ backgroundColor: data.highlightColor || '#f59e0b' }}></div>
                                    <p className="text-6xl md:text-7xl text-gray-100 font-bold leading-tight max-w-full drop-shadow-2xl opacity-95">{data.description}</p>
                                    {data.price && (
                                        <div className="mt-12">
                                            <div className="relative group rounded-3xl p-[3px] bg-gradient-to-br from-white/80 to-amber-500/50 overflow-hidden" style={{ animation: 'pulse-glow 3s infinite', boxShadow: `0 0 60px ${data.highlightColor || '#f59e0b'}80` }}>
                                                <div className="absolute inset-0 bg-white/20 blur-xl"></div>
                                                <div className="relative px-20 py-10 rounded-[21px] backdrop-blur-xl bg-black/50 border border-white/30 flex flex-col items-center justify-center shadow-inner">
                                                    <span className="text-7xl md:text-8xl font-black text-white drop-shadow-[0_0_30px_rgba(255,255,255,0.8)]">{data.price}</span>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [slides, setSlides] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(true);
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                  try {
                    const parsed = JSON.parse(saved);
                    setSlides(Array.isArray(parsed) && parsed.length > 0 ? parsed : INITIAL_SLIDES);
                  } catch (e) {
                    setSlides(INITIAL_SLIDES);
                  }
                } else {
                  setSlides(INITIAL_SLIDES);
                }
            }, []);

            const playlist = useMemo(() => slides.length > 0 ? slides : INITIAL_SLIDES, [slides]);
            const currentSlide = playlist[currentIndex] || playlist[0];

            const nextSlide = useCallback(() => { setCurrentIndex(prev => (prev + 1) % playlist.length); setProgress(0); }, [playlist.length]);

            useEffect(() => {
                if (!isPlaying || isAdminOpen) return;
                const interval = setInterval(() => {
                    setProgress(prev => {
                        if (prev >= 100) { nextSlide(); return 0; }
                        return prev + (100 / (SLIDE_DURATION_MS / 100));
                    });
                }, 100);
                return () => clearInterval(interval);
            }, [isPlaying, isAdminOpen, nextSlide]);

            if (!currentSlide) return null;

            return (
                <div className="relative w-screen h-screen bg-black overflow-hidden group">
                    <Slide key={currentSlide.id} data={currentSlide} />
                    <div className="absolute bottom-0 left-0 w-full h-4 bg-black/60 z-40">
                        <div className="h-full bg-gradient-to-r from-amber-600 to-yellow-400 transition-all duration-100 ease-linear" style={{ width: `${progress}%` }}></div>
                    </div>
                    <div className="absolute top-8 left-8 z-50 opacity-0 group-hover:opacity-100 transition-opacity flex gap-4">
                        <button onClick={() => { setCurrentIndex(prev => (prev - 1 + playlist.length) % playlist.length); setProgress(0); }} className="p-4 bg-white/10 hover:bg-amber-600 rounded-full" title="Previous Slide"><Icons.SkipBack className="w-6 h-6" /></button>
                        <button onClick={() => setIsPlaying(!isPlaying)} className="p-4 bg-white/10 hover:bg-amber-600 rounded-full" title={isPlaying ? 'Pause' : 'Resume'}>{isPlaying ? <Icons.Pause className="w-6 h-6" /> : <Icons.Play className="w-6 h-6" />}</button>
                        <button onClick={() => { setCurrentIndex(prev => (prev + 1) % playlist.length); setProgress(0); }} className="p-4 bg-white/10 hover:bg-amber-600 rounded-full" title="Next Slide"><Icons.SkipForward className="w-6 h-6" /></button>
                    </div>
                    <div className="absolute top-8 right-8 z-50 opacity-0 group-hover:opacity-100 transition-opacity flex gap-4">
                        <button onClick={() => setIsAdminOpen(true)} className="p-4 bg-white/10 hover:bg-blue-600 rounded-full" title="Admin Slide Editor"><Icons.Settings className="w-6 h-6" /></button>
                    </div>
                    {isAdminOpen && <AdminPanel slides={slides} onSave={(s) => { setSlides(s); localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }} onClose={() => setIsAdminOpen(false)} />}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
