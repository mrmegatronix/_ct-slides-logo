<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Signage</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&family=Roboto:wght@700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM (UMD for standalone) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000;
        color: white;
        overflow: hidden;
      }
      h1, h2, h3, .serif {
        font-family: 'Playfair Display', serif;
      }

      /* Animations */
      @keyframes subtleZoom {
        0% { transform: scale(1); }
        100% { transform: scale(1.15); }
      }
      @keyframes pulse-glow {
        0%, 100% { filter: drop-shadow(0 0 40px currentColor); }
        50% { filter: drop-shadow(0 0 70px currentColor); }
      }

      .text-glow { text-shadow: 0 0 20px rgba(255,255,255,0.4); }
    </style>

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        // --- CONSTANTS & TYPES ---
        const SLIDE_DURATION_MS = 30000;
        const STORAGE_KEY = 'restaurant_slides_v10';

        const INITIAL_SLIDES = [
          {
            id: '0',
            day: 'Welcome',
            title: '',
            description: '',
            price: '',
            imageUrl: '',
            backgroundImageUrl: '',
            descriptionImageUrl: 'front-images/GOLD-FLAME-LOGO-BLACK.jpg',
            highlightColor: '#d4af37',
            type: 'promo',
            disabled: false
          },
          { id: '1', day: 'Monday', title: 'Steak Day Monday\'s', description: 'Start your week off with a 200g Succulent Rump Steak, cooked to your liking, served with golden fries and a green garden salad.', price: '$20', imageUrl: 'images/steak-night.jpg', backgroundImageUrl: 'back-images/bg1.jpg', highlightColor: '#f59e0b', type: 'promo', disabled: false },
          { id: '2', day: 'Tuesday', title: 'Chase the Ace', description: 'Purchase a beverage between 3pm and 5.30pm and you\'re in the draw.', price: '5.30pm Draw!', imageUrl: '', backgroundImageUrl: '', highlightColor: '#ef4444', type: 'promo', disabled: true },
          { id: '3', day: 'Wednesday', title: 'Quiz Night', description: 'Every Wednesday Night from 7.00pm, $190 in prizes up for grabs. Bookings Essential.', price: 'FREE ENTRY', imageUrl: '', backgroundImageUrl: '', highlightColor: '#eab308', type: 'promo', disabled: false },
          { id: '4', day: 'Thursday', title: 'Burger Day Thursdays', description: 'Your choice of Chicken, Beer Battered Fish, Pork Belly or Coasters Beef Burger, all served with Golden Fries & Onion Rings.', price: '$19 each or 2 for $35!', imageUrl: 'images/burger-night.jpg', backgroundImageUrl: '', highlightColor: '#f97316', type: 'promo', disabled: false },
          { id: '5', day: 'Thursday & Friday', title: 'Happy Hours!', description: 'Enjoy 10% discount on selected beverages between 4.30pm & 6.30pm.', price: '10% Off!', imageUrl: '', backgroundImageUrl: 'back-images/drink.jpg', highlightColor: '#3b82f6', type: 'promo', disabled: false },
          { id: '6', day: 'Saturday', title: 'Chase the Ace', description: 'Purchase a beverage between 3pm and 5.30pm and you\'re in the draw. Drawn @ 6.30pm.', price: '6.30pm Draw', imageUrl: '', backgroundImageUrl: '', highlightColor: '#06b6d4', type: 'promo', disabled: true },
          { id: '7', day: 'Sunday', title: 'Two Course Sunday Roast', description: 'Traditional roast of the day with roasted vegetables, seasonal greens and rich gravy, with an Ice Cream Sundae to finish.', price: '$28', imageUrl: 'images/roast.jpg', backgroundImageUrl: '', highlightColor: '#84cc16', type: 'promo', disabled: false },
          { id: '9', day: 'Thursday', title: 'Free Pool Thursdays', description: 'Our Pool Table is Free all day and night on Thursdays! Grab a cue and challenge your mates.', price: 'FREE', imageUrl: 'images/burger-night.jpg', backgroundImageUrl: '', highlightColor: '#f97316', type: 'promo', disabled: false },
          { id: '10', day: 'Membership', title: 'Loyalty App', description: 'Join our loyalty program! Earn points with every purchase and redeem them for food and drinks.', price: 'Join Today', imageUrl: 'images/platter.jpg', backgroundImageUrl: '', highlightColor: '#8b5cf6', type: 'promo', disabled: false },
          { id: '11', day: 'Note', title: 'Chase the Ace Will Resume Next Week', description: 'Thank you for participating! The draw will be back at its regular time next week.', price: 'See You Next Week!', imageUrl: '', backgroundImageUrl: '', highlightColor: '#d4af37', type: 'promo', disabled: false }
        ];

        // --- ICONS (Inline SVGs) ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );

        const Icons = {
            Settings: (props) => <Icon {...props} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />,
            Play: (props) => <Icon {...props} path={<polygon points="5 3 19 12 5 21 5 3"/>} />,
            Pause: (props) => <Icon {...props} path={<><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></>} />,
            SkipForward: (props) => <Icon {...props} path={<><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></>} />,
            SkipBack: (props) => <Icon {...props} path={<><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></>} />,
            Plus: (props) => <Icon {...props} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Trash2: (props) => <Icon {...props} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            Save: (props) => <Icon {...props} path={<><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>} />,
            X: (props) => <Icon {...props} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />,
            ArrowLeft: (props) => <Icon {...props} path={<><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>} />,
            LayoutGrid: (props) => <Icon {...props} path={<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>} />,
            Image: (props) => <Icon {...props} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></>} />,
            Eye: (props) => <Icon {...props} path={<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>} />,
            EyeOff: (props) => <Icon {...props} path={<><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></>} />
        };

        const AdminPanel = ({ slides, onSave, onClose }) => {
            const [localSlides, setLocalSlides] = useState(slides);
            const [hasChanges, setHasChanges] = useState(false);

            const handleUpdate = (id, updates) => {
                setLocalSlides(prev => prev.map(s => s.id === id ? { ...s, ...updates } : s));
                setHasChanges(true);
            };

            const handleCreate = () => {
                const newSlide = { id: Date.now().toString(), type: 'promo', day: 'Monday', title: 'New Event', description: 'Details...', price: '$0', imageUrl: 'images/steak-night.jpg', highlightColor: '#f59e0b', disabled: false };
                setLocalSlides([...localSlides, newSlide]);
                setHasChanges(true);
            };

            const handleDelete = (id) => {
                if (confirm('Delete this slide?')) {
                    setLocalSlides(prev => prev.filter(s => s.id !== id));
                    setHasChanges(true);
                }
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-950 text-white flex flex-col overflow-hidden">
                    <div className="bg-slate-900 border-b border-slate-800 p-6 flex justify-between items-center">
                        <div className="flex items-center gap-6">
                            <button onClick={onClose} className="p-2 hover:bg-slate-800 rounded-full transition-colors"><Icons.ArrowLeft className="w-6 h-6" /></button>
                            <h1 className="text-3xl font-serif font-bold text-amber-500 flex items-center gap-3"><Icons.LayoutGrid className="w-8 h-8" /> Admin Slide Editor</h1>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={handleCreate} className="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-lg font-bold border border-slate-700 flex items-center gap-2"><Icons.Plus className="w-5 h-5" /> Add Slide</button>
                            <button onClick={() => { onSave(localSlides); setHasChanges(false); }} disabled={!hasChanges} className={`px-8 py-2.5 rounded-lg font-bold transition-all flex items-center gap-2 ${hasChanges ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}><Icons.Save className="w-5 h-5" /> {hasChanges ? 'Save Changes' : 'Saved'}</button>
                            <button onClick={onClose} className="p-2 hover:bg-red-500/20 text-slate-400 hover:text-red-400 rounded-full"><Icons.X className="w-6 h-6" /></button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-8 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-slate-900 to-slate-950">
                        <div className="max-w-[1600px] mx-auto grid grid-cols-1 xl:grid-cols-2 2xl:grid-cols-3 gap-6 pb-20">
                            {localSlides.map((slide, idx) => (
                                <div key={slide.id} className={`bg-slate-900/50 border rounded-2xl overflow-hidden flex flex-col p-6 space-y-4 hover:border-amber-500/30 transition-all ${slide.disabled ? 'opacity-50 grayscale-[0.5] border-slate-800' : 'border-slate-800'}`}>
                                    <div className="flex justify-between items-center mb-2">
                                        <div className="flex items-center gap-3">
                                            <span className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-500">Slide #{idx + 1}</span>
                                            {slide.disabled && <span className="text-[10px] font-bold bg-red-500/20 text-red-500 px-2 py-0.5 rounded uppercase">Disabled</span>}
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => handleUpdate(slide.id, { disabled: !slide.disabled })} className={`p-2 rounded-lg transition-all ${slide.disabled ? 'text-amber-500 bg-amber-500/10' : 'text-slate-500 hover:text-white hover:bg-slate-700'}`} title={slide.disabled ? "Enable Slide" : "Disable Slide"}>
                                                {slide.disabled ? <Icons.EyeOff className="w-4 h-4" /> : <Icons.Eye className="w-4 h-4" />}
                                            </button>
                                            <button onClick={() => handleDelete(slide.id)} className="p-2 text-slate-600 hover:text-red-400 hover:bg-red-400/10 rounded-lg"><Icons.Trash2 className="w-4 h-4" /></button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Day</label><input type="text" value={slide.day || ''} onChange={e => handleUpdate(slide.id, { day: e.target.value })} className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-sm outline-none focus:border-amber-500" /></div>
                                        <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Price</label><input type="text" value={slide.price || ''} onChange={e => handleUpdate(slide.id, { price: e.target.value })} className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-sm outline-none focus:border-amber-500 font-bold text-amber-500" /></div>
                                    </div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Title</label><input type="text" value={slide.title || ''} onChange={e => handleUpdate(slide.id, { title: e.target.value })} className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-sm font-bold outline-none focus:border-amber-500" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Description</label><textarea value={slide.description || ''} onChange={e => handleUpdate(slide.id, { description: e.target.value })} rows={3} className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-sm outline-none focus:border-amber-500 resize-none" /></div>
                                    <div className="flex items-center gap-4">
                                        <div className="flex-1 space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Image Path</label><input type="text" value={slide.imageUrl || ''} onChange={e => handleUpdate(slide.id, { imageUrl: e.target.value })} className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-xs font-mono outline-none focus:border-amber-500" /></div>
                                        <div className="shrink-0 space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Color</label><input type="color" value={slide.highlightColor || '#f59e0b'} onChange={e => handleUpdate(slide.id, { highlightColor: e.target.value })} className="h-9 w-9 bg-transparent block cursor-pointer border border-slate-700 rounded-lg" /></div>
                                    </div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Background Image</label><input type="text" value={slide.backgroundImageUrl || ''} onChange={e => handleUpdate(slide.id, { backgroundImageUrl: e.target.value })} placeholder="e.g., back-images/custom-bg.jpg" className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-xs font-mono outline-none focus:border-amber-500" /></div>
                                    <div className="space-y-1"><label className="text-[10px] font-bold text-slate-500 uppercase">Description Image</label><input type="text" value={slide.descriptionImageUrl || ''} onChange={e => handleUpdate(slide.id, { descriptionImageUrl: e.target.value })} placeholder="e.g., front-images/promo-image.jpg" className="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-2 text-xs font-mono outline-none focus:border-amber-500" /></div>
                                </div>
                            ))}
                            <button onClick={handleCreate} className="border-2 border-dashed border-slate-800 rounded-2xl flex flex-col items-center justify-center p-12 text-slate-600 hover:text-amber-500 hover:border-amber-500/50 transition-all"><Icons.Plus className="w-10 h-10 mb-2" /><span className="font-bold uppercase tracking-widest text-xs">Add New Promo</span></button>
                        </div>
                    </div>
                </div>
            );
        };

        const Slide = ({ data }) => {
            const isLogoSlide = (!data.title && !data.description) || data.day === 'Welcome';

            return (
                <div className="relative w-full h-full overflow-hidden font-sans bg-black">
                    <style>{`
                        @keyframes slide-in-epic {
                          0% { transform: scale(1.2); opacity: 0; filter: blur(20px); }
                          100% { transform: scale(1); opacity: 1; filter: blur(0px); }
                        }
                        .animate-epic-in {
                          animation: slide-in-epic 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                        }
                        .text-glow {
                          text-shadow: 0 0 30px rgba(255,255,255,0.6);
                        }
                    `}</style>

                    <div className="absolute inset-0">
                        {!isLogoSlide && (
                            <>
                                <img src={data.backgroundImageUrl || data.imageUrl} alt={data.title} onError={(e) => { e.currentTarget.style.display = 'none'; }} className="w-full h-full object-cover transition-transform duration-[30000ms] ease-linear transform scale-100" style={{ animation: 'subtleZoom 35s linear infinite alternate' }} />
                                <div className="absolute inset-0 bg-black/40"></div>
                                <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/60"></div>
                            </>
                        )}
                    </div>
                    <div className="relative z-10 w-full h-full mx-auto text-center overflow-hidden animate-epic-in">
                        {isLogoSlide ? (
                            <div className="flex flex-col items-center justify-center w-full h-full">
                                <div className="relative w-[70vw] h-[70vh] flex items-center justify-center">
                                    <img src={data.descriptionImageUrl || data.imageUrl} alt="Coasters Tavern Logo" className="relative max-w-full max-h-full object-contain drop-shadow-[0_10px_40px_rgba(0,0,0,0.5)]" />
                                </div>
                                {data.day === 'Welcome' && data.title && (
                                    <h1 className="mt-12 text-7xl font-serif font-black text-white text-glow" style={{ textWrap: 'balance' }}>{data.title}</h1>
                                )}
                            </div>
                        ) : (
                            <>
                                <div className="absolute top-[25%] left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-full animate-slide-down">
                                    <span className="px-8 py-3 rounded-full text-3xl md:text-5xl font-black uppercase tracking-[0.2em] border-2 border-white/40 backdrop-blur-xl shadow-[0_0_40px_rgba(255,255,255,0.3)]" style={{ backgroundColor: `${data.highlightColor}40`, borderColor: data.highlightColor, color: '#fff' }}>{data.day || 'Special Event'}</span>
                                </div>

                                <div className="absolute top-[40%] left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-full px-4">
                                    <h1 className="text-4xl md:text-6xl lg:text-[6rem] font-serif font-black leading-[1] text-white drop-shadow-[0_10px_30px_rgba(0,0,0,0.9)] text-glow tracking-tight text-center" style={{ textWrap: 'balance' }}>{data.title}</h1>
                                    <div className="h-2 w-32 md:w-60 rounded-full shadow-[0_0_30px_rgba(245,158,11,0.8)] mx-auto mt-4" style={{ backgroundColor: data.highlightColor || '#f59e0b' }}></div>
                                </div>

                                <div className="absolute top-[50%] left-1/2 -translate-x-1/2 z-20 w-[90%] md:w-[80%]">
                                    <p className="text-xl md:text-3xl lg:text-5xl text-gray-100 font-bold leading-snug drop-shadow-2xl opacity-95 text-center" style={{ textWrap: 'balance' }}>{data.description}</p>
                                </div>

                                {data.price && (
                                    <div className="absolute top-[80%] left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-full flex justify-center px-4">
                                        <div className="relative group max-w-[90vw] rounded-xl md:rounded-2xl p-[2px] bg-gradient-to-br from-white/80 to-amber-500/50 overflow-visible mx-auto" style={{ animation: 'pulse-glow 3s infinite', boxShadow: `0 0 30px ${data.highlightColor || '#f59e0b'}60` }}>
                                            <div className="absolute inset-0 bg-white/20 blur-xl rounded-xl md:rounded-2xl overflow-hidden"></div>
                                            <div className="relative px-8 py-6 rounded-[10px] md:rounded-[14px] backdrop-blur-xl bg-black/50 border border-white/30 flex flex-col items-center justify-center shadow-inner min-w-[150px]">
                                                <span className="text-[6vw] md:text-[4vw] lg:text-[3.5vw] leading-normal font-black text-white drop-shadow-[0_0_20px_rgba(255,255,255,0.8)] text-center whitespace-normal break-words w-full py-2">{data.price}</span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [slides, setSlides] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(true);
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [progress, setProgress] = useState(0);
            const startTimeRef = useRef(Date.now());

            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                  try {
                    const parsed = JSON.parse(saved);
                    setSlides(Array.isArray(parsed) && parsed.length > 0 ? parsed : INITIAL_SLIDES);
                  } catch (e) {
                    setSlides(INITIAL_SLIDES);
                  }
                } else {
                  setSlides(INITIAL_SLIDES);
                }
            }, []);

            const playlist = useMemo(() => {
                const activeSlides = slides.length > 0 ? slides : INITIAL_SLIDES;
                return activeSlides.filter(s => !s.disabled);
            }, [slides]);

            const currentSlide = playlist[currentIndex] || playlist[0];

            const nextSlide = useCallback(() => { 
                if (playlist.length === 0) return;
                setCurrentIndex(prev => (prev + 1) % playlist.length); 
                setProgress(0); 
                startTimeRef.current = Date.now();
            }, [playlist.length]);

            const prevSlide = useCallback(() => { 
                if (playlist.length === 0) return;
                setCurrentIndex(prev => (prev - 1 + playlist.length) % playlist.length); 
                setProgress(0); 
                startTimeRef.current = Date.now();
            }, [playlist.length]);

            useEffect(() => {
                if (!isPlaying || isAdminOpen) return;
                const interval = setInterval(() => {
                    const now = Date.now();
                    const elapsed = now - startTimeRef.current;
                    const newProgress = (elapsed / SLIDE_DURATION_MS) * 100;

                    if (newProgress >= 100) {
                        nextSlide();
                    } else {
                        setProgress(newProgress);
                    }
                }, 100);
                return () => clearInterval(interval);
            }, [isPlaying, isAdminOpen, nextSlide]);

            if (!currentSlide) return null;

            return (
                <div className="relative w-screen h-screen bg-black overflow-hidden group">
                    <Slide key={currentSlide.id} data={currentSlide} />
                    <div className="absolute bottom-0 left-0 w-full h-4 bg-black/60 z-40">
                        <div className="h-full bg-gradient-to-r from-amber-600 to-yellow-400 transition-all duration-100 ease-linear" style={{ width: `${progress}%` }}></div>
                    </div>
                    <div className="absolute top-8 left-8 z-50 opacity-0 group-hover:opacity-100 transition-opacity flex gap-4">
                        <button onClick={prevSlide} className="p-4 bg-white/10 hover:bg-amber-600 rounded-full" title="Previous Slide"><Icons.SkipBack className="w-6 h-6" /></button>
                        <button onClick={() => {
                            const nextIsPlaying = !isPlaying;
                            setIsPlaying(nextIsPlaying);
                            if (nextIsPlaying) {
                                startTimeRef.current = Date.now() - (progress / 100) * SLIDE_DURATION_MS;
                            }
                        }} className="p-4 bg-white/10 hover:bg-amber-600 rounded-full" title={isPlaying ? 'Pause' : 'Resume'}>{isPlaying ? <Icons.Pause className="w-6 h-6" /> : <Icons.Play className="w-6 h-6" />}</button>
                        <button onClick={nextSlide} className="p-4 bg-white/10 hover:bg-amber-600 rounded-full" title="Next Slide"><Icons.SkipForward className="w-6 h-6" /></button>
                    </div>
                    <div className="absolute top-8 right-8 z-50 opacity-0 group-hover:opacity-100 transition-opacity flex gap-4">
                        <button onClick={() => setIsAdminOpen(true)} className="p-4 bg-white/10 hover:bg-blue-600 rounded-full" title="Admin Slide Editor"><Icons.Settings className="w-6 h-6" /></button>
                    </div>
                    {isAdminOpen && <AdminPanel slides={slides} onSave={(s) => { setSlides(s); localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); setProgress(0); startTimeRef.current = Date.now(); }} onClose={() => setIsAdminOpen(false)} />}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
